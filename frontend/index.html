<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B站 AI Agent - 智能下载助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px 24px;
            border-bottom: 1px solid #233;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 20px;
            color: #4fc3f7;
        }
        .header .status {
            font-size: 12px;
            color: #888;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            align-self: flex-end;
            background: #1a73e8;
            color: white;
        }
        .message.assistant {
            align-self: flex-start;
            background: #1e1e2e;
            border: 1px solid #333;
        }
        .message.assistant pre {
            background: #0d1117;
            padding: 8px;
            border-radius: 6px;
            margin-top: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .input-container {
            padding: 16px 20px;
            background: #1a1a2e;
            border-top: 1px solid #233;
            display: flex;
            gap: 12px;
        }
        .input-container input {
            flex: 1;
            padding: 12px 16px;
            background: #0f0f1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }
        .input-container input:focus {
            border-color: #4fc3f7;
        }
        .input-container button {
            padding: 12px 24px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .input-container button:hover {
            background: #1557b0;
        }
        .input-container button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .typing {
            display: inline-block;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 20px 8px;
        }
        .quick-actions button {
            padding: 6px 12px;
            background: #1e1e2e;
            border: 1px solid #333;
            border-radius: 16px;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-actions button:hover {
            border-color: #4fc3f7;
            color: #4fc3f7;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>B站 AI Agent</h1>
        <span class="status" id="status">Connecting...</span>
    </div>

    <div class="chat-container" id="chat">
        <div class="message assistant">
            Hello! I am your Bilibili download assistant.
            You can send me a Bilibili URL and I will download it for you.
            You can also ask me about download history, Cookie status, etc.
        </div>
    </div>

    <div class="quick-actions">
        <button onclick="sendQuick('Cookie状态怎么样？')">Cookie状态</button>
        <button onclick="sendQuick('我下载了哪些视频？')">下载历史</button>
        <button onclick="sendQuick('所有下载任务列表')">任务列表</button>
    </div>

    <div class="input-container">
        <input type="text" id="input" placeholder="输入消息或B站链接..."
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // 前端生成 session_id，每次打开页面就是一个新会话
        const sessionId = crypto.randomUUID();
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        // Health check
        fetch('/api/health')
            .then(r => r.json())
            .then(() => { statusEl.textContent = 'Online'; statusEl.style.color = '#4caf50'; })
            .catch(() => { statusEl.textContent = 'Offline'; statusEl.style.color = '#f44336'; });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing-indicator';
            div.innerHTML = 'Thinking<span class="typing">...</span>';
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const msg = inputEl.value.trim();
            if (!msg) return;

            addMessage('user', msg);
            inputEl.value = '';
            sendBtn.disabled = true;

            addTyping();

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, session_id: sessionId })
                });
                const data = await resp.json();
                removeTyping();
                addMessage('assistant', data.reply);
            } catch (e) {
                removeTyping();
                addMessage('assistant', 'Error: ' + e.message);
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        function sendQuick(msg) {
            inputEl.value = msg;
            sendMessage();
        }

        inputEl.focus();
    </script>
</body>
</html>
